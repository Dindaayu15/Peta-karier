<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Karier Mahasiswa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Peta Karier Mahasiswa</h2>
        <form id="predictionForm">
            <label for="nama">Nama:</label>
            <input type="text" id="nama" name="nama" required>

            <label for="nim">NIM:</label>
            <input type="text" id="nim" name="nim" required>

            <label for="ipk">IPK:</label>
            <input type="number" step="0.01" id="ipk" name="ipk" required>

            <label for="pendapatan_orangtua">Pendapatan Orang Tua:</label>
            <input type="number" id="pendapatan_orangtua" name="pendapatan_orangtua" required>

            <button type="submit">Prediksi Karier</button>
        </form>

        <div id="hasilPrediksi" class="hidden">
            <h3>Hasil Prediksi:</h3>
            <p><strong>Jabatan yang Diprediksi:</strong> <span id="prediksiJabatan"></span></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
