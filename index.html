<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Karier Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Peta Karier Mahasiswa</h2>
    <form id="prediksi-form">
        <input type="number" id="mahasiswa_id" placeholder="ID Mahasiswa" required>
        <input type="number" id="ipk" step="0.01" placeholder="IPK" required>
        <input type="number" id="pendapatan" placeholder="Pendapatan Orangtua" required>
        <button type="submit">Prediksi</button>
    </form>
    <h3>Hasil Prediksi:</h3>
    <p id="hasil"></p>

    <script src="script.js"></script>
</body>
</html>
