<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Karier Mahasiswa</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Font Awesome (Icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
            margin-top: 50px;
        }
        .card {
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .result-box {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-graduation-cap"></i> Peta Karier</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#riwayat">Riwayat Prediksi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html"><i class="fas fa-user-shield"></i> Admin Dashboard</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Form Input -->
    <div class="container">
        <div class="card p-4">
            <h3 class="text-center"><i class="fas fa-chart-line"></i> Prediksi Karier Mahasiswa</h3>
            <form id="predictForm" action="/predict" method="POST">
                <label for="ipk">IPK:</label>
                <input type="number" step="0.01" id="ipk" name="ipk" required>

                <label for="pendapatan_orangtua">Pendapatan Orang Tua:</label>
                <input type="number" id="pendapatan_orangtua" name="pendapatan_orangtua" required>

                <button type="submit" id="predictButton">Prediksi</button>
</form>


            <!-- Hasil Prediksi -->
            <div class="result-box p-3 mt-3 bg-light border rounded text-center">
                <h5>Hasil Prediksi:</h5>
                <p id="hasilPrediksi" class="fw-bold text-success"></p>
            </div>
        </div>
    </div>

    <!-- Riwayat Prediksi -->
    <div class="container mt-5" id="riwayat">
        <h4 class="text-center"><i class="fas fa-history"></i> Riwayat Prediksi</h4>
        <div class="table-responsive">
            <table class="table table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Nama</th>
                        <th>IPK</th>
                        <th>Pendapatan</th>
                        <th>Prediksi</th>
                    </tr>
                </thead>
                <tbody id="riwayatTable">
                    <!-- Data akan dimuat di sini -->
                </tbody>
            </table>
        </div>
    </div>
    <button onclick="exportCSV()">Export CSV</button>
    <button onclick="kirimEmail()">Kirim Email</button>
    <button onclick="screenshotTable()">Screenshot</button>

    <!-- Footer -->
    <footer class="text-center py-3 mt-4 bg-dark text-white">
        <p>&copy; 2025 Peta Karier Mahasiswa | Created with ❤️</p>
    </footer>

    <!-- JavaScript -->
    <script>
        document.getElementById("predictionForm").addEventListener("submit", function(event) {
            event.preventDefault();
            
            // Ambil data dari form
            let ipk = document.getElementById("ipk").value;
            let pendapatan = document.getElementById("pendapatan").value;

            // Kirim ke backend Flask
            fetch("http://127.0.0.1:5000/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ ipk: ipk, pendapatan_orangtua: pendapatan })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("hasilPrediksi").innerText = data.prediksi_jabatan;
                document.querySelector(".result-box").style.display = "block";

                // Tambahkan ke Riwayat
                let table = document.getElementById("riwayatTable");
                let row = table.insertRow();
                row.innerHTML = `<td>${table.rows.length}</td><td>Anonim</td><td>${ipk}</td><td>${pendapatan}</td><td>${data.prediksi_jabatan}</td>`;
            })
            .catch(error => console.error("Error:", error));
        });
    </script>
<script src="script.js"></script>
</body>
</html>
